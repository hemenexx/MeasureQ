; MeasureQ - bezdratove mereni velicin (ESP-NOW)
; Jeden PlatformIO projekt, firmware cile:
;   env:node           - mericí krabicka, produkcni firmware (deep sleep cyklus)
;   env:node-test      - mericí krabicka, diagnosticky test senzoru (bez sleep,
;                         posila hodnoty pres ESP-NOW broadcast - viz env:hub-test)
;   env:hub            - centralni jednotka (ESP32 30pin + 3x TM1637, USB-C napajeni)
;   env:hub-test       - centralni jednotka, test prijmu senzorovych dat (bez displeju)
;   env:wifi-test-node - mericí krabicka, test dosahu ESP-NOW (vysilac)
;   env:wifi-test-hub  - centralni jednotka, test dosahu ESP-NOW (prijimac)
; Sdileny kod (protokol) je v src/common/, per-cil kod v src/node/,
; src/node_test/, src/hub/, src/hub_test/, src/wifi_test_node/ a
; src/wifi_test_hub/.

[platformio]
default_envs = node

[env]
framework = arduino
monitor_speed = 115200

[node_common]
; Sdilene nastaveni pro env:node, env:node-test a env:wifi-test-node (stejna
; deska/knihovny). POZOR: board definice je nejblizsi dostupna generic deska
; pro ESP32-C3-SuperMini klony z AliExpress - neni oficialne v PlatformIO
; board manageru pod timto nazvem. Nutno overit/upravit po prvnim flashi.
platform = espressif32
board = esp32-c3-devkitm-1
; ESP32-C3-SuperMini nema externi USB-UART cip (CP2102/CH340) - jen vestaveny
; nativni USB-Serial/JTAG radic. Bez techto flagu Arduino "Serial" defaultne
; mapuje na klasickou UART0 periferii (piny, ktere na tomhle boardu nikam
; nevedou), takze Serial.print() by sice v kodu "bezel", ale fyzicky by
; nikam neodesilal data - presne to zpusobilo, ze zadny Serial Monitor
; (ani ten spusteny primo uzivatelem) nikdy nic nezobrazil, i kdyz podle LED
; indikatoru firmware bezel spravne (2026-08-08).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit AHTX0 @ ^2.0.6
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    sciosense/ScioSense_ENS16x @ ^2.0.5

; Kazdy environment nize musi v build_src_filter vyloucit vsechny ostatni
; src/* slozky krome te, kterou skutecne pouziva - jinak by PlatformIO
; zkousel kompilovat vsechny main() najednou.

[env:node]
platform = ${node_common.platform}
board = ${node_common.board}
build_src_filter = +<*> -<hub/> -<hub_test/> -<node_test/> -<wifi_test_node/> -<wifi_test_hub/>
build_flags = ${node_common.build_flags}
lib_deps = ${node_common.lib_deps}

[env:node-test]
; Diagnosticky sketch pro overeni zapojeni senzoru (I2C scanner + prubezne
; cteni hodnot) - navic posila hodnoty pres ESP-NOW broadcast, viz
; env:hub-test na prijimaci strane.
platform = ${node_common.platform}
board = ${node_common.board}
build_src_filter = +<*> -<hub/> -<hub_test/> -<node/> -<wifi_test_node/> -<wifi_test_hub/>
build_flags = ${node_common.build_flags}
lib_deps = ${node_common.lib_deps}

[env:hub]
; ESP32 30pin (generovy DOIT DEVKIT V1 klon) - nutno overit po prvnim flashi.
platform = espressif32
board = esp32doit-devkit-v1
build_src_filter = +<*> -<node/> -<node_test/> -<hub_test/> -<wifi_test_node/> -<wifi_test_hub/>

[env:hub-test]
; Test prijmu senzorovych dat pres ESP-NOW (bez displeju/tlacitek) - proti
; nemu bezi env:node-test (posila MeasurementPacket na broadcast adresu).
platform = espressif32
board = esp32doit-devkit-v1
build_src_filter = +<*> -<node/> -<node_test/> -<hub/> -<wifi_test_node/> -<wifi_test_hub/>

[env:wifi-test-node]
; Test dosahu ESP-NOW - vysilaci strana. Bezi na stejne desce jako env:node
; (ESP32-C3-SuperMini), ale bez zavislosti na senzoru - jen WiFi/ESP-NOW.
platform = ${node_common.platform}
board = ${node_common.board}
build_src_filter = +<*> -<hub/> -<hub_test/> -<node/> -<node_test/> -<wifi_test_hub/>
build_flags = ${node_common.build_flags}

[env:wifi-test-hub]
; Test dosahu ESP-NOW - prijimaci strana. Bezi na stejne desce jako env:hub
; (ESP32 30pin), ale bez displeju/tlacitek - jen WiFi/ESP-NOW + Serial log.
platform = espressif32
board = esp32doit-devkit-v1
build_src_filter = +<*> -<node/> -<node_test/> -<hub/> -<hub_test/> -<wifi_test_node/>
