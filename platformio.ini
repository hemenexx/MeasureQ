; MeasureQ - bezdratove mereni velicin (ESP-NOW)
; Jeden PlatformIO projekt, dva firmware cile:
;   env:node - mericí krabicka (ESP32-C3-SuperMini + ENS160/AHT21, 2x AAA)
;   env:hub  - centralni jednotka (ESP32 30pin + 3x TM1637, USB-C napajeni)
; Sdileny kod (protokol) je v src/common/, per-cil kod v src/node/ a src/hub/.

[platformio]
default_envs = node

[env]
framework = arduino
monitor_speed = 115200

[env:node]
; POZOR: board definice je nejblizsi dostupna generic deska pro
; ESP32-C3-SuperMini klony z AliExpress - neni oficialne v PlatformIO
; board manageru pod timto nazvem. Nutno overit/upravit po prvnim flashi.
platform = espressif32
board = esp32-c3-devkitm-1
build_src_filter = +<*> -<hub/>
lib_deps =
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    sciosense/ScioSense_ENS16x @ ^0.2.0

[env:hub]
; ESP32 30pin (generovy DOIT DEVKIT V1 klon) - nutno overit po prvnim flashi.
platform = espressif32
board = esp32doit-devkit-v1
build_src_filter = +<*> -<node/>
